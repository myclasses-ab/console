<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="50%" stop-color="white" stop-opacity="0.12" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#heroGradient)" />

  <!-- Soft glow orbs -->
  <circle cx="1020" cy="70" r="220" fill="white" fill-opacity="0.07" />
  <circle cx="140" cy="360" r="190" fill="white" fill-opacity="0.05" />

  <!-- Abstract wave -->
  <path
    d="M0,330 C280,270 620,390 920,310 S1200,270 1200,270 V400 H0 Z"
    fill="white"
    fill-opacity="0.06"
  />

  <!-- Diagonal shine -->
  <path d="M-120,420 L520,-80 L720,-80 L80,420 Z" fill="url(#shine)" opacity="0.5" />

  <!-- Open book icon -->
  <g transform="translate(990, 250) scale(5)" opacity="0.1" fill="white">
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
  </g>

  <!-- Decorative dots -->
  <circle cx="1120" cy="110" r="7" fill="white" fill-opacity="0.22" />
  <circle cx="1060" cy="175" r="4" fill="white" fill-opacity="0.18" />
  <circle cx="130" cy="95" r="5" fill="white" fill-opacity="0.18" />
  <circle cx="85" cy="155" r="3" fill="white" fill-opacity="0.22" />
  <circle cx="250" cy="280" r="4" fill="white" fill-opacity="0.14" />
</svg>
